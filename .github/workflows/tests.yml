name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: python scripts/verify.py --strict
      - if: runner.os != 'Linux'
        run: python scripts/verify.py
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: docs/test-report.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: browser
          path: docs/browser-report.json
