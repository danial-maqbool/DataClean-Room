name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux native test tools
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y tesseract-ocr ffmpeg poppler-utils
      - name: Install runtime without development packages
        run: python bootstrap.py
      - name: Check runtime-only environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/preflight.py --report-dir artifacts/runtime-qa
          "$PY" -m pip check
      - name: Install development packages in the same project environment
        run: python bootstrap.py --dev
      - name: Run prerequisite and application tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip check
          if [ "$RUNNER_OS" = 'Linux' ]; then
            "$PY" scripts/preflight.py --tests --require-native --report-dir artifacts/local-qa
            "$PY" scripts/verify.py --strict --report-dir artifacts/local-qa
          else
            "$PY" scripts/preflight.py --tests --report-dir artifacts/local-qa
            "$PY" scripts/verify.py --report-dir artifacts/local-qa
          fi
          "$PY" -m pip freeze > artifacts/local-qa/requirements-resolved.txt
          git rev-parse HEAD > artifacts/local-qa/source-commit.txt
      - name: Verify exported pixels and the retained acceptance fixture
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python scripts/ocr_redaction_check.py --report-dir artifacts/ocr-pixels
          .venv/bin/python scripts/acceptance_check.py --report-dir artifacts/ocr-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install native browser test tools
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y tesseract-ocr ffmpeg
      - run: python bootstrap.py --dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: .venv/bin/python scripts/browser_check.py --record --report-dir artifacts/local-qa
      - name: Verify OCR review controls and real downloads
        run: .venv/bin/python scripts/ocr_browser_check.py --report-dir artifacts/ocr-browser
      - name: Check encrypted worker restart when the project provides the check
        shell: bash
        run: |
          if [ -f scripts/worker_check.py ]; then
            .venv/bin/python scripts/worker_check.py --report-dir artifacts/local-qa
          fi
          git rev-parse HEAD > artifacts/local-qa/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser
          path: artifacts/
