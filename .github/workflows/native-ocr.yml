name: Native OCR acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install recorded Windows OCR version
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'tesseract-5.4.0.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'tesseract-ocr'
          # Checksum source: microsoft/winget-pkgs, UB-Mannheim.TesseractOCR 5.4.0.20240606.
          # This is the OCR version used in the reported Windows acceptance failure.
          $url = 'https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 180
          $expected = 'C885FFF6998E0608BA4BB8AB51436E1C6775C2BAFC2559A19B423E18678B60C9'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Tesseract installer checksum mismatch.' }
          $process = Start-Process $installer -ArgumentList '/S',("/D=$destination") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Tesseract installer failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $destination 'tesseract.exe'))) { throw 'Tesseract executable is absent.' }
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install macOS OCR
        if: runner.os == 'macOS'
        timeout-minutes: 8
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew list --versions tesseract || brew install tesseract
      - name: Verify native OCR and English data
        shell: bash
        run: |
          tesseract --version
          tesseract --list-langs | tr -d '\r' | grep -Fx eng
      - run: python bootstrap.py --dev
      - name: Run real OCR integration and retained acceptance
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/preflight.py --tests --require-native --report-dir artifacts/native-ocr
          "$PY" -m pip check
          "$PY" scripts/verify.py --report-dir artifacts/native-ocr
          "$PY" scripts/acceptance_check.py --report-dir artifacts/native-acceptance
          "$PY" -m pip freeze > artifacts/native-ocr/requirements-resolved.txt
          git rev-parse HEAD > artifacts/native-ocr/source-commit.txt
          tesseract --version > artifacts/native-ocr/tesseract-version.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ocr-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
