name: Verify and prepare release
on:
  push:
    branches: ['release/v0.2.0']
permissions:
  contents: read
concurrency:
  group: release-v020
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: danial-maqbool/LocalFlow-Studio
          ref: a42262279fef3a69f031fecfcdd54cabc78c682b
          path: _runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/prepare_release.py
      - run: python -m pip install black==25.1.0
      - run: python -m black app localdesk tests scripts run.py bootstrap.py
      - run: python scripts/materialize.py --refresh
      - id: source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize standalone v0.2.0 source and documentation'
            git push origin HEAD:refs/heads/release/v0.2.0
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: python scripts/verify.py --strict
      - if: runner.os != 'Linux'
        run: python scripts/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python }}
          path: docs/test-report.json
  evidence:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt -f json -o docs/dependency-audit.json
      - run: python scripts/verify.py --strict
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py --record
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: docs/platforms
      - name: Record verified release evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Record real demo, dependency audit, and platform evidence'
            git push origin HEAD:refs/heads/release/v0.2.0
          fi
          git archive --format=zip --output=source.zip HEAD
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-release
          path: |
            source.zip
            source-commit.txt
            docs/*-report.json
            docs/dependency-audit.json
            docs/assets
