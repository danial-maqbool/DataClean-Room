name: Prepare reviewed OCR correction
on:
  push:
    branches: [qa/ocr-redaction-20260907]
    paths: ['.qa-ocr/**', '.github/workflows/ocr-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository_owner == 'danial-maqbool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check and apply the reviewed source delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, subprocess, zlib
          root = Path('.qa-ocr')
          parts = [p.read_bytes() for p in sorted(root.glob('part*.bin'))]
          if len(parts) != 3:
              raise SystemExit('Expected three transport parts.')
          # Correct a known transport transcription before checking the exact reviewed checksum.
          first = base64.b64encode(parts[0]).decode()
          first = first.replace('Cip0SauVzHnHlwlpEJTAdqhSKSK7T', 'Cip0SauVzHlwlpEJTAdqhSK7T')
          parts[0] = base64.b64decode(first, validate=True)
          raw = b''.join(parts)
          if hashlib.sha256(raw).hexdigest() != '801942049c526b8154cf30808ecf4a6f2f9bf610fd0359aef0c80358eb106ed7':
              raise SystemExit('Reviewed source checksum mismatch.')
          bundle = json.loads(zlib.decompress(raw))
          for name, expected in bundle['expected_sha256'].items():
              p = Path(name)
              if p.is_absolute() or '..' in p.parts or p.is_symlink():
                  raise SystemExit('Unsafe target.')
              if expected is None:
                  if p.exists():
                      raise SystemExit('New target already exists: ' + name)
              elif hashlib.sha256(p.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Source changed: ' + name)
          patch = bundle['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for name, text in bundle['append'].items():
              if name not in ('HANDOFF.md', 'README.md'):
                  raise SystemExit('Unexpected documentation target.')
              with Path(name).open('a', encoding='utf-8') as f:
                  f.write(text)
          handoff = json.loads(Path('handoff.json').read_text())
          handoff['local_acceptance_status'] = 'partial_target_windows_retest_required'
          handoff['ocr_correction'] = {'policy': 'docs/OCR_REDACTION_FIX.md', 'target_retests': ['DC-04', 'DC-08'], 'historical_windows_failure_preserved': True}
          Path('handoff.json').write_text(json.dumps(handoff, indent=2) + '\n', encoding='utf-8')
          manifest = json.loads(Path('source-manifest.json').read_text())
          for name in bundle['expected_sha256']:
              manifest['files'].setdefault(name, '')
          Path('source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          for p in root.glob('part*.bin'):
              p.unlink()
          root.rmdir()
          PY
      - run: python -m pip install black==25.1.0
      - run: python -m black app/ocr_matching.py app/native.py app/sanitizer.py app/service.py tests/test_ocr_matching.py tests/test_ocr_redaction.py tests/test_ocr_api.py scripts/ocr_redaction_check.py scripts/ocr_browser_check.py
      - run: python scripts/materialize.py --refresh && python scripts/materialize.py
      - name: Commit normal source for the full pull request checks
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix OCR custom-value misses with bounded candidates and review safeguards'
          git push origin HEAD:refs/heads/qa/ocr-redaction-20260907
          git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-ocr-source
          path: source.zip
          retention-days: 7
