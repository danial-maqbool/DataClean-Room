name: Verify local testing handoff
on:
  push:
    branches: ['handoff/local-testing']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p = Path('tests/test_handoff.py')
          text = p.read_text(encoding='utf-8')
          old = 'self.root = Path(self.temp.name)\n'
          new = 'self.root = Path(self.temp.name).resolve()\n'
          if old in text:
              assert text.count(old) == 1, 'Review the changed setup fixture.'
              p.write_text(text.replace(old, new), encoding='utf-8')
          else:
              assert new in text, 'The expected setup fixture is absent.'
          m = json.loads(Path('source-manifest.json').read_text())
          for n in m['files']:
              b = Path(n).read_bytes()
              m['files'][n] = hashlib.sha256(b.replace(b'\r\n', b'\n') if n.endswith('.bat') else b).hexdigest()
          Path('source-manifest.json').write_text(json.dumps(m, indent=2, sort_keys=True)+'\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_handoff.py source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Resolve temporary directory aliases in installer regression tests'
            git push origin HEAD:refs/heads/handoff/local-testing
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - name: Check a clean runtime before test dependencies
        shell: bash
        run: |
          python bootstrap.py
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/preflight.py --report-dir artifacts/runtime-qa
          "$PY" -m pip check
          python bootstrap.py --dev
          "$PY" scripts/preflight.py --tests --report-dir artifacts/local-qa
          "$PY" -m pip check
          if [ "$RUNNER_OS" = Linux ]; then
            "$PY" scripts/verify.py --strict --report-dir artifacts/local-qa
          else
            "$PY" scripts/verify.py --report-dir artifacts/local-qa
          fi
          "$PY" -m pip freeze > artifacts/local-qa/requirements-resolved.txt
          git rev-parse HEAD > artifacts/local-qa/source-commit.txt
      - name: Direct browser and worker checks
        if: runner.os == 'Linux' && matrix.python == '3.13'
        shell: bash
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python scripts/browser_check.py --record --report-dir artifacts/local-qa
          if [ -f scripts/worker_check.py ]; then
            .venv/bin/python scripts/worker_check.py --report-dir artifacts/local-qa
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
